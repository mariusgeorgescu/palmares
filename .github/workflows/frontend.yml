name: frontend

# Workflow separat de `images.yml`, și asta e o decizie, nu o scăpare.
#
# `images.yml` se declanșează DOAR pe tag `v*.*.*` sau `workflow_dispatch`, pentru că o imagine de
# serviciu e un build musl static al întregului arbore Cardano: baza partajată singură ia peste o oră
# pe un runner arm64. Cu trigger pe main plus `cancel-in-progress`, fiecare rulare era anulată de
# commitul următor și workflow-ul nu terminase niciodată.
#
# Un build PureScript + Vite ia minute, nu ore. Deci frontendul poate și trebuie să se construiască
# la fiecare push care îl atinge — altfel am descoperi că nu compilează abia la următorul tag.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# Același namespace ca `images.yml`, scris explicit pentru același motiv: luat din
# `github.repository_owner` ar face namespace-ul un efect secundar al locului unde stă repo-ul.
env:
  GHCR_OWNER: mariusgeorgescu

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefer-offline --no-audit

      # Cache-ul spago e separat de cel npm: `extraPackages` sunt clone-uri git, iar registry-ul e
      # descărcat per build. Fără el, fiecare rulare reclonează șase repo-uri.
      - uses: actions/cache@v4
        with:
          path: |
            frontend/.spago
            frontend/output
            ~/.cache/spago
          key: spago-${{ runner.os }}-${{ hashFiles('frontend/spago.yaml', 'frontend/spago.lock') }}
          restore-keys: spago-${{ runner.os }}-

      - run: npx spago install
      - run: npm run check-formatting
      - run: npx spago build --json-errors
      - run: npm test
      # Bundle-ul de PRODUCȚIE, ca să prindem aici un `Main` care nu compilează — `npm run build`
      # ar construi `MainDemo` și ar trece verde cu AppM rupt.
      - run: npm run build:prod

      # e2e pe bundle-ul DEMO: fixturi, deci determinist, fără backend și fără rețea. Un decodor
      # corect și un ecran alb trec amândouă testele unitare — asta le separă.
      #
      # `--only-shell` ia doar headless shell-ul (~100 MB) în loc de tot Chrome: suita nu deschide
      # nicio fereastră.
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 7

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_OWNER }}
          # Ca în `images.yml`: `GITHUB_TOKEN` e scopat pe owner-ul repo-ului, care E namespace-ul de
          # mai sus, deci `packages: write` e toată credențiala. Fără `||` către un secret posibil
          # neseta, care ar face un PAT expirat să întreacă tokenul care funcționează.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          # amd64 pe lângă arm64: clusterul e arm64, dar imaginea nu are nimic nativ — e node plus
          # JavaScript — deci al doilea platform costă minute, nu ore, și scutește o sarcină la F2.
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/palmares-frontend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/palmares-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
