# compose.yaml — the preprod governance stack, re-derivable from scratch.
# Minimum host: 4 cores, 12 GB RAM, 60 GB free SSD.
#
# ARCHITECTURE, and the line above used to claim "arm64 and amd64 both work" for the whole file.
# Half right. The `chain` profile does: node, Postgres, db-sync and Kupo all publish both. The four
# images THIS project builds do not — `.github/workflows/images.yml` pushes `platforms: linux/arm64`
# only — so on an amd64 host `--profile app` and `--profile write` have to be fed by
# `scripts/build-images.sh`, which builds for the host architecture. Adding amd64 to that matrix is
# not a one-line change and is deliberately not done: the arm64 run already has a 350-minute timeout
# for four static musl GHC builds, and the alternative is QEMU across a Haskell link step.
#
#   docker compose --profile chain up -d        # node + db-sync + postgres
#   docker compose --profile app   up -d        # + the public query API (reads Postgres only)
#   docker compose --profile write up -d        # + Kupo, the interaction API and attest-sync
#
# `write` is its own profile because it needs things the read path does not: a UTxO index, the node
# socket, and `config/config_palmares_validators.json`, which does not exist until
# `admin deploy-reference-scripts` has run once.
#
# It also needs BASIC_USER and BASIC_PASS in the environment. They have no defaults on purpose — a
# shipped credential is worse than a missing one — so compose names the one you forgot. The audit
# (`TD-02`) found this profile unable to BOOT for want of them and, once booted, unable to serve an
# attestation for want of `attest-sync`, which nothing here started. Both are fixed.
#
# TIME UNTIL USEFUL (measured 2026-10-20 on an Apple-silicon laptop, Experiment A):
#   node, via Mithril          : ~20-40 min  (default; RESTORE_SNAPSHOT=false for a genesis audit run)
#   db-sync from genesis       : <= 7 h      caught up at ~9x real time, then follows live at 1:1
# FOOTPRINT (same measurement): node 20.2 GB + db-sync state 2.9 GB + Postgres 10.4 GB = ~34 GB.
# Peak memory: db-sync 5.90 GiB anonymous, node 2.74 GiB, Postgres 0.86 GiB.
#
# ONLY db-sync CARRIES A MEMORY CAP, and that is a decision rather than an omission. Its 6144M is the
# limit the cluster runs, so a local OOM there is a real signal. The node's and Postgres's peaks above
# are SINGLE observations at tip, and Postgres's in particular is not an upper bound: with
# shared_buffers=768MB and two maintenance workers at maintenance_work_mem=512MB, a matview refresh or
# an index build can legitimately go well past 0.86 GiB. A cap derived from one reading and never
# exercised converts a slow query into an OOM kill of the only synced preprod database on the host, so
# the number has to be measured under that load before it is written here.
#
# This file is the promoted Experiment A rig, not a fresh draft: the two config directories under
# deploy/ are the exact bytes that produced the measurements above.
#
# IMAGE PINNING — the real arithmetic, because the header used to claim all of it was pinned and it
# was not. Eight image references, two groups:
#   * FOUR third-party, each pinned by its multi-arch INDEX digest: cardano-node, Postgres, db-sync
#     (verified 2026-10-19 to carry linux/arm64) and Kupo (added 2026-10-24).
#   * FOUR of this project's own, which are `ghcr.io/${GH_OWNER}/palmares-*:${TAG:-latest}` and are
#     NOT digest-pinnable here: both the namespace and the tag are deployment inputs, and the digest
#     changes on every `images.yml` run. The pin for these is the TAG — set `TAG` to a release tag
#     rather than taking `latest` — and a digest belongs in the GitOps manifests, which name one
#     deployment, not in the file that has to work for every one of them.
#
# `deploy/dbsync/db-sync-config.yaml` is the SINGLE source for db-sync's config. The Kubernetes
# ConfigMap is generated from it by one `sed` repointing NodeConfigFile. Do not fork it.

name: palmares

services:
  # Mithril bootstraps THE NODE ONLY. It does nothing for db-sync: db-sync streams every block from
  # genesis and maintains its own ledger state, and no preprod db-sync snapshot exists. That is
  # deliberate, not a gap — see docs/adr/0001-governance-data-substrate.md for why a restore would
  # be a correctness regression on per-epoch DRep voting power.
  cardano-node:
    profiles: [chain, app]
    image: ghcr.io/blinklabs-io/cardano-node:11.1.2@sha256:3620624c4cb9ac4e750b6c5c2d674c478010f4a193fdf7418f4930820562c11d
    # `run` + explicit --config/--topology, NOT `NETWORK: preprod`: that env var routes the
    # entrypoint through run-network and the image's own bundled, unpinned config. We pin ours.
    # NETWORK must still be PRESENT (empty) — see the db-sync service for why that matters there.
    command:
      - run
      - --config
      - /node-config/config.json
      - --topology
      - /node-config/topology.json
    environment:
      NETWORK: ""
      # run-node reads CARDANO_NETWORK (default: mainnet) to resolve the Mithril aggregator path
      # and /opt/cardano/config/preprod/{genesis,ancillary}.vkey. Setting --config does NOT set it.
      CARDANO_NETWORK: preprod
      RESTORE_SNAPSHOT: "${RESTORE_SNAPSHOT:-true}"
    volumes:
      # Read-only, and deliberately so: run-node tries `touch ${CARDANO_CONFIG}` and, if it
      # succeeds, sed-edits PeerSharing/TraceMempool into the file. :ro makes that touch fail (it
      # is wrapped in `set +e`), which is how the pinned hashes in SOURCES.sha256 stay true.
      - ./deploy/node-config:/node-config:ro
      - node-db:/data/db
      # A NAMED volume, not a bind mount: the node socket lives in the Docker VM's filesystem, and
      # a UNIX socket in a macOS bind mount does not work.
      - node-ipc:/ipc
    healthcheck:
      test: ["CMD-SHELL", "test -S /ipc/node.socket"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The Mithril download runs before the socket appears. Failures inside start_period do not
      # count, so db-sync waits instead of crash-looping on a missing socket.
      start_period: 60m
    restart: unless-stopped

  postgres:
    profiles: [chain, app]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: cexplorer
      POSTGRES_USER: postgres
      # TD-09. NO DEFAULT, for the same reason BASIC_USER has none: a password written into a
      # committed file is a credential that ships, and `devonly` was that credential at three points
      # in this file plus five more for the two palmares roles. The name was the whole mitigation,
      # and a name is not one — it sets the superuser password of a database that `initdb` then bakes
      # into the volume on first boot, where nothing later re-reads this line to correct it.
      #
      # `:?` and not `:-`: compose refuses the whole `up` and names the variable, so the failure is
      # one line at the start instead of a stack that comes up reachable with a guessable password.
      # Ports bind 127.0.0.1 and that is not a substitute — it is why this was Medium and not High.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — no default, a shipped password is a shipped credential}
      PGDATA: /var/lib/postgresql/data/pgdata
    # synchronous_commit=off is safe here: on a crash db-sync rolls back to its last stored block
    # and re-reads from the node. This is the same tuning the cluster runs, so local numbers transfer.
    command:
      - -c
      - shared_buffers=768MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=off
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cexplorer"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cardano-db-sync:
    profiles: [chain, app]
    image: ghcr.io/blinklabs-io/cardano-db-sync:13.7.1.0@sha256:2a341eb32f15a3e65435f4123c3186f467bf2ed9d3ea2eac449592b5a54eb950
    # The entrypoint runs `set -euo pipefail` and then `if [[ -z ${NETWORK} ]]` with no default, so
    # NETWORK must be PRESENT AND EMPTY: unset is an unbound-variable crash, non-empty makes it
    # ignore --config and use the image's bundled config. Empty selects the
    # "Connecting to network specified in configuration.yaml" branch, which execs
    # `cardano-db-sync --schema-dir ... --state-dir ... "$@"` — i.e. `command:` is appended verbatim.
    environment:
      NETWORK: ""
      # gen-pgpass writes /configuration/pgpass from these five; setting all five keeps it off the
      # /run/secrets path entirely.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cexplorer
      POSTGRES_USER: postgres
      # Same variable, same contract as the postgres service above: no default. It has to MATCH what
      # initdb baked into the volume, which is the other half of why a default here was dangerous —
      # a stale `devonly` reads as "db-sync cannot authenticate" rather than as "wrong password".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — it must match the value the postgres volume was initialised with}
      # RESTORE_SNAPSHOT is DELIBERATELY UNSET for db-sync. See the node comment above and ADR 0001.
    # The entrypoint's snapshot path does `curl -LOC -` and `touch "${__base}.restored"` in the CWD
    # and the image sets no WORKDIR. Harmless while RESTORE_SNAPSHOT is unset, correct the moment it
    # is not — keep it.
    working_dir: /var/lib/cexplorer
    command:
      - --config
      - /dbsync-config/db-sync-config.yaml
      - --socket-path
      - /node-ipc/node.socket
    volumes:
      - ./deploy/dbsync:/dbsync-config:ro
      # The SAME pinned directory the node runs from, at the path NodeConfigFile names, so db-sync
      # replays the ledger against byte-identical genesis files. config.json references the four
      # genesis files by BARE FILENAME, so they must sit beside it — they do.
      - ./deploy/node-config:/node-config:ro
      - db-sync-state:/var/lib/cexplorer
      - node-ipc:/node-ipc
    depends_on:
      cardano-node: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Measured: 5.90 GiB anonymous at tip, no OOM kill under this cap. It is also the exact
          # limit planned for the cluster, so a local OOM here is a real signal, not a local quirk.
          memory: 6144M

  # THE WRITE PATH'S UTXO INDEX. Atlas's local provider is `socketPath` + `kupoUrl` and there is no
  # fourth option: every non-hosted Atlas provider needs Kupo, and the remaining one — `ogmiosUrl` +
  # `kupoUrl` — is unavailable here because node 11.1.2 requires Ogmios v7 and Ogmios v7 breaks
  # Atlas (changed mempool/nextTransaction JSON, protocol-parameter field naming, tx object shape).
  # That is the measured reason the Belt System's write path ended up on a hosted provider.
  # `GYNodeKupo` takes parameters, slot, submission and gov/stake state from the NODE directly and
  # uses Kupo only for UTxO query, datum lookup and await-confirmed, so no Ogmios is involved at all.
  #
  # The hosted provider is now `blockfrostKey`, NOT `maestroToken`: Maestro withdrew its Cardano API
  # in 2026 and `preprod.gomaestro-api.org` no longer resolves. See ADR 0004. This service is the
  # self-hosted alternative to that key, and on a Linux host it is the whole answer; on macOS the
  # node socket is reachable only from inside this compose project, never from the host CLI.
  #
  # KUPO v2.12.0 AGAINST NODE 11.1.2 IS MEASURED, NOT ASSUMED — and the published documents say
  # otherwise, which is why it was measured. Kupo's own compatibility table tops out at node 10.1.*,
  # its v2.12.0 release notes declare a 11.0.1 dependency, and the port to the 11.1 stack is an open
  # pull request. Probed 2026-10-22 against the synced preprod node in experiments/dbsync-preprod:
  #   kupo_connection_status 1.0
  #   kupo_most_recent_checkpoint == kupo_most_recent_node_tip == 136947661
  #   kupo_network_synchronization 1.0
  # It connects, follows the tip, and stays there. Re-probe after a node bump rather than trusting
  # this line.
  kupo:
    profiles: [write]
    # Digest added 2026-10-24: this was the one third-party image still floating on a tag. It is the
    # multi-arch INDEX digest, resolved with `docker buildx imagetools inspect
    # cardanosolutions/kupo:v2.12.0` and cross-checked against the `RepoDigests` of the copy already
    # pulled on this host — the index carries linux/amd64 and linux/arm64, so pinning it costs the
    # amd64 host nothing.
    image: cardanosolutions/kupo:v2.12.0@sha256:7d3c62368a4a5a609f5cf0ee6949eb8d491ed8f5a4d05b38da3213d95735f03b
    command:
      - --node-socket
      - /ipc/node.socket
      - --node-config
      - /node-config/config.json
      - --host
      - 0.0.0.0
      - --workdir
      - /db
      - --since
      - "${KUPO_SINCE:-origin}"
      - --match
      - "${KUPO_MATCH:-*}"
    # `--match '*'` BY DEFAULT, and the narrow alternative is deliberately not the default.
    # `kupoQueryUtxo` resolves whatever address the transaction builder asks about: the admin
    # wallet's own UTxOs, and the five validator addresses — which are script hashes that change on
    # every redeploy. A narrow `--match` would therefore have to be edited in lockstep with
    # `config_palmares_validators.json`, and the failure when it was not is a transaction that
    # cannot find its own inputs, reported as if the wallet were empty.
    #
    # If the index size does become a problem, the narrow form is
    #   KUPO_MATCH="<admin addr>" plus one `--match` per validator address
    # and it must be re-derived after each `admin deploy-reference-scripts`.
    #
    # `--since origin` is the DEFAULT BECAUSE IT IS RE-SYNCABLE. The fast path is to set
    # KUPO_SINCE to the current tip ("<slot>.<header hash>", from
    # `cardano-cli query tip --testnet-magic 1`) and fund the admin key AFTERWARDS, so every UTxO
    # the deploy needs is created after the start point. The footgun is permanent and worth naming:
    # a UTxO created BEFORE the start point is invisible to Kupo for ever, so losing the kupo-db
    # volume after a tip-start means the admin's funding UTxO can no longer be found and the key has
    # to be re-funded. From origin, a re-sync is just slow.
    #
    # NOT MEASURED HERE: how long `--match '*' --since origin` takes on preprod, and how large the
    # index gets. That is the next number this file should carry.
    environment:
      KUPO_SINCE: "${KUPO_SINCE:-origin}"
    volumes:
      - node-ipc:/ipc:ro
      # The same pinned directory the node and db-sync read, so Kupo resolves eras against
      # byte-identical genesis files.
      - ./deploy/node-config:/node-config:ro
      - kupo-db:/db
    ports: ["127.0.0.1:${KUPO_PORT:-1442}:1442"]
    depends_on:
      cardano-node: {condition: service_healthy}
    healthcheck:
      # /health serves Prometheus text, and `kupo_connection_status 1.0` is the one line that
      # distinguishes "running" from "actually talking to the node".
      test: ["CMD-SHELL", "wget -qO- http://localhost:1442/health | grep -q 'kupo_connection_status  *1.0'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60m
    restart: unless-stopped

  # THE WRITE PATH ITSELF, and it runs as a CONTAINER rather than on the host for one reason: the
  # node socket lives in a named volume because a UNIX socket in a macOS bind mount does not work,
  # so anything using `socketPath` has to be in this compose network to reach it.
  #
  # `operation.prv` is bind-mounted read-only and is gitignored. It is the admin key; the `admin`
  # CLI reads it from the working directory by that exact name.
  interaction-api:
    profiles: [write]
    image: ghcr.io/${GH_OWNER:-mariusgeorgescu}/palmares-interaction-api:${TAG:-latest}
    # TD-11, AND THE ONE EXCEPTION TO IT. The image ends `USER nobody`; this service puts uid 0 back,
    # visibly, because of the provider shape configured below and nothing else.
    #
    # cardano-node creates `/ipc/node.socket` as `srwxr-xr-x root:root` (measured on the running
    # preprod node), and `connect()` on a UNIX socket requires the WRITE bit — so `nobody` cannot
    # reach it and Atlas dies at provider init, before the service has served anything. No
    # supplementary group closes it: the group bits are `r-x`, and the node has no umask knob to make
    # the socket group-writable. The `:ro` on the mount below is NOT the cause; a read-only
    # superblock still permits connecting to a socket on it.
    #
    # The image stays non-root for the deployment that does not need the socket — a cluster running
    # `{"blockfrostKey": …}` — which is the shape this line should be deleted for.
    user: "0:0"
    environment:
      # Inline JSON, not a baked file: `decodeConfigEnvOrFile` reads this env var first and falls
      # back to config/config_atlas.json. Keeping it here means the image carries no provider
      # config and no credential, and the socket path is the in-container one.
      ATLAS_CORE_CONFIG: >-
        {"coreProvider":{"socketPath":"/ipc/node.socket","kupoUrl":"http://kupo:1442"},
         "networkId":"${CARDANO_NETWORK:-preprod}",
         "logging":[{"type":{"tag":"stderr"},"severity":"Info","verbosity":"V2"}]}
      PORT: "8082"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      # FAIL-CLOSED AND UNSET BY DEFAULT — TD-02. The service refuses to boot without these, which
      # is the intended behaviour and was also the reason the documented `write` profile could not
      # start at all: nothing here supplied them, so `docker compose --profile write up` died on the
      # first service that mattered. `:?` makes compose say which variable is missing instead of
      # letting the container die with it, and a default would be a shipped credential.
      BASIC_USER: "${BASIC_USER:?set BASIC_USER — interaction-api is fail-closed and will not boot without it}"
      BASIC_PASS: "${BASIC_PASS:?set BASIC_PASS — interaction-api is fail-closed and will not boot without it}"
    volumes:
      - node-ipc:/ipc:ro
      # Written by `admin deploy-reference-scripts`; absent until the first deploy, which is why
      # this service is in its own profile rather than in `app`.
      - ./config:/app/config:ro
    ports: ["127.0.0.1:${INTERACTION_API_PORT:-8082}:8082"]
    depends_on:
      cardano-node: {condition: service_healthy}
      kupo: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # GV-04. The two roles `sql/050_roles.sql` declares, created before anything connects as them.
  #
  # A one-shot and not a line in query-api's entrypoint: `apply-roles` is idempotent and must fail the
  # process rather than warn, which is exactly what a Job-shaped service with `restart: "no"` gives.
  # It is in the `app` profile because query-api cannot start without it.
  palmares-roles:
    # Both profiles: `attest-sync` is in `write` and depends on it, and the job is idempotent, so
    # running it again when `write` comes up costs one no-op transaction.
    profiles: [app, write]
    image: ghcr.io/${GH_OWNER:-mariusgeorgescu}/palmares-admin:${TAG:-latest}
    command: ["apply-roles"]
    environment:
      # TD-09, all three. `apply-roles` is `die`-on-unset in the binary (README §11 calls both role
      # passwords fail-closed), and this file was handing it `devonly` so that fail-closed check
      # never fired — the same shape as the `attest-sync` defaults the image dropped: a fail-closed
      # check whose value is supplied by the deployment is not fail-closed. These two passwords are
      # what `palmares_owner` and `palmares_ro` are CREATED with, so a default here is the password
      # of two roles that then serve the public read path.
      PG_CONN_STR: "host=postgres user=postgres password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — no default} dbname=cexplorer port=5432"
      PALMARES_OWNER_PASSWORD: "${PALMARES_OWNER_PASSWORD:?set PALMARES_OWNER_PASSWORD — apply-roles creates palmares_owner with it and never invents one}"
      PALMARES_RO_PASSWORD: "${PALMARES_RO_PASSWORD:?set PALMARES_RO_PASSWORD — apply-roles creates palmares_ro with it and never invents one}"
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  # CS-03 / TD-02. THE SERVICE WITHOUT WHICH THE `write` PROFILE CANNOT SERVE AN ATTESTATION.
  #
  # `interaction-api` builds and submits; nothing projected what it submitted, so the documented
  # self-host path could write to the chain and never read it back. The audit found the profile
  # unable to boot for the credentials above and unable to WORK for this.
  #
  # Its own schema, `palmares_attest`, which is why it connects as the owner rather than as
  # `palmares_ro`: it creates and migrates its own tables. That schema survives query-api's
  # `DROP SCHEMA palmares CASCADE` by design — see `ensureAttestSchema`.
  #
  # `KUPO_MATCH '*'` is the kupo service's default and is load-bearing here: this service follows
  # `<policy>.*`, so Kupo must have indexed those names to have them to give.
  attest-sync:
    profiles: [write]
    image: ghcr.io/${GH_OWNER:-mariusgeorgescu}/palmares-attest-sync:${TAG:-latest}
    environment:
      # TD-09: no default. It has to be the same value `palmares-roles` created the role with, and a
      # default that silently disagrees with it is an authentication failure dressed up as a bad DSN.
      PG_CONN_STR: "host=postgres user=palmares_owner password=${PALMARES_OWNER_PASSWORD:?set PALMARES_OWNER_PASSWORD — no default} dbname=cexplorer port=5432"
      KUPO_URL: "http://kupo:1442"
      PORT: "8084"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      FETCH_BATCH_SIZE: "${FETCH_BATCH_SIZE:-100000}"
      ROLLBACK_MARGIN: "${ROLLBACK_MARGIN:-2160}"
      # Declared so the knob is reachable from `.env`: compose passes nothing through that it does
      # not name here, so without this line an operator setting it would see no effect. The default
      # is the binary's own, so this changes no behaviour.
      READY_MAX_LAG_SLOTS: "${READY_MAX_LAG_SLOTS:-1200}"
      # `CS-06`: a schema-version bump makes this service DROP every chain-sync table and re-index
      # from the chain, and it now REFUSES to do that unless this names the stored version being
      # destroyed. Declared for the reason above — compose passes through nothing it does not name —
      # and left empty on purpose: a value here would authorise the next wipe silently, which is the
      # defect the guard exists to prevent.
      ATTEST_SYNC_CONFIRM_WIPE: "${ATTEST_SYNC_CONFIRM_WIPE:-}"
    volumes:
      # The deployed-validators config, for the minting policy hash it follows. Same mount and same
      # reason as interaction-api's: written by `admin deploy-reference-scripts`, absent until then.
      - ./config:/app/config:ro
    ports: ["127.0.0.1:${ATTEST_SYNC_PORT:-8084}:8084"]
    depends_on:
      postgres: {condition: service_healthy}
      kupo: {condition: service_healthy}
      palmares-roles: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  query-api:
    profiles: [app]
    image: ghcr.io/${GH_OWNER:-mariusgeorgescu}/palmares-query-api:${TAG:-latest}
    environment:
      # GV-04: `palmares_ro` and not `postgres`. The documented self-host path ran the PUBLIC read
      # service as the database superuser, which is the one connection in the stack that should be
      # least privileged — it serves unauthenticated traffic and writes nothing.
      #
      # It still OWNS the `palmares` schema bootstrap, which needs DDL, so the owner role is what the
      # schema work runs as; `palmares_ro` is what serves reads. Both are created by
      # `palmares-roles` above.
      #
      # THE SPLIT IS NOW ACTUALLY WIRED. This file set one `palmares_owner` DSN and left
      # `PALMARES_PG_OWNER_CONN_STR` unset, so the owner pool fell back to it and a single owner
      # connection served both the DDL and every unauthenticated request — the comment above
      # described a separation the configuration did not make. Two DSNs, two pools: requests on
      # `palmares_ro`, the boot DDL and the matview refresh on `palmares_owner`.
      #
      # TD-09: neither password has a default. This is the PUBLIC read service, so `devonly` here was
      # the guessable password of the two roles behind an unauthenticated API.
      PG_CONN_STR: "host=postgres user=palmares_ro password=${PALMARES_RO_PASSWORD:?set PALMARES_RO_PASSWORD — no default} dbname=cexplorer port=5432"
      PALMARES_PG_OWNER_CONN_STR: "host=postgres user=palmares_owner password=${PALMARES_OWNER_PASSWORD:?set PALMARES_OWNER_PASSWORD — no default} dbname=cexplorer port=5432"
      PORT: "8083"
      # Empty allowlist denies all cross-origin: fail-closed. Set it for a local frontend.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      PALMARES_VIEW_REFRESH_SECONDS: "${PALMARES_VIEW_REFRESH_SECONDS:-300}"
      PALMARES_READY_MAX_LAG_SECONDS: "${PALMARES_READY_MAX_LAG_SECONDS:-300}"
      PALMARES_AMBER_LAG_SECONDS: "${PALMARES_AMBER_LAG_SECONDS:-120}"
    ports: ["127.0.0.1:${QUERY_API_PORT:-8083}:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      palmares-roles: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  node-db:
  node-ipc:
  postgres:
  db-sync-state:
  kupo-db:
